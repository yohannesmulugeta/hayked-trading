name: Build and publish website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hayked-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Restore Vite source entry
        run: cp vite-index.html index.html

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Build production website
        run: npx vite build

      - name: Publish compiled files to repository root
        run: |
          rm -rf assets brand uploads
          cp -R dist/assets ./assets
          [ -d dist/brand ] && cp -R dist/brand ./brand || true
          [ -d dist/uploads ] && cp -R dist/uploads ./uploads || true
          [ -f dist/favicon.svg ] && cp dist/favicon.svg ./favicon.svg || true
          cp dist/index.html ./index.html
          cp dist/index.html ./404.html
          touch .nojekyll

      - name: Commit compiled website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html assets brand uploads favicon.svg .nojekyll
          if git diff --cached --quiet; then
            echo "No compiled changes to publish."
            exit 0
          fi
          git commit -m "Publish compiled website [skip ci]"
          git push
